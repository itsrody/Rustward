name: build

on:
  workflow_dispatch:
  schedule:
    # Every 2 days at 00:17 UTC.
    - cron: "17 0 */2 * *"

permissions:
  contents: write

concurrency:
  group: rustward-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTWARD_TIMING: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Refresh upstream list pins
        run: cargo run --release --quiet -- update-pins

      - name: Build and verify Rustward.txt
        run: cargo run --release --quiet -- build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rustward-dist
          path: dist/
          if-no-files-found: error

      - name: Commit refreshed pins and output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/sources.toml dist
          if git diff --cached --quiet; then
            echo "No upstream or output changes."
            exit 0
          fi
          git commit -m "chore: refresh upstream filters and dist [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
