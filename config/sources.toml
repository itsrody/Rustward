[engine]
profile = "desktop"
adblock_version = "=0.13.6"
permissions = 0

[output]
path = "dist/Rustward.txt"
emit_order = "compiler-friendly-v1"
inline_audit_comments = false
title = "Rustward"
# Omitted: derived from the newest parseable pinned `last_modified` value in lists.lock.
expires = "2 days"
description = "Verified uBO-compatible filter list for adblock-rust engines."

[verify]
required = true
corpus = ["generated", "fixtures"]
max_mismatches = 0
# Large enough to probe a meaningful slice of every admitted rule family and rewrite receipt.
max_cases = 250000
max_cosmetic_hosts = 2048
bench_iterations = 3

[admit]
# `^`-anchored URL patterns are flagged as regex by adblock but compile to bounded literal
# matchers. Redundant punctuation escapes are canonicalized before emission; real regex escapes
# (\d, \n, \p{...}, …) stay excluded.
literal_boundary_regex = true
# Normalize literal `:contains(...)` / `:-abp-contains(...)` selectors to `:has-text(...)` and keep
# the ABP extended form as the VERIFY baseline. Regex-valued arguments remain excluded.
literal_contains_rewrite = true
# Normalize AdGuard's literal `$queryprune=name` alias to `$removeparam=name` before parsing.
# Regex-valued query parameters remain unsupported and stay excluded.
queryprune_alias = true
# Slow/complex families removed in one batch before per-rule admission. `nested_procedural`
# catches slow operators adblock folds into a single native CSS selector.
exclude_families = ["nested_procedural"]
# `$all` is intentionally accepted: rust-adblock narrows its popup/inline bits but the remaining
# type bits are useful. Partially dropped method/scheme values stay accepted for the same reason.
# Every other SemanticGap (entity domains, bare hostnames, match-case) is excluded.
accepted_semantic_gaps = ["all", "dropped_method", "dropped_scheme"]

[directives]
enabled = true
env = ["chromium", "ext_ublock"]
include_root = "config/includes"

[golden_rule]
require_fast_native = true
require_official_resources = true
require_engine_trust = true
rewrite_or_exclude = true
retain_eligible_non_fusable = true
zero_violations = true

[resources.ubo]
repo = "https://github.com/gorhill/uBlock"
commit = "3cca944b4a4c5f3473d6cb7153e6fb99b5f7d1db"
scriptlets_path = "src/js/resources/scriptlets.js"
snapshot_path = "config/resources/ubo-official.json"
snapshot_sha256 = "ddc13cecf2441456e0c707a484fb7e76a4d82d1ad13b09e8075ee1ab2e4cd038"
trust_bit = 0b00000001
allow_standard = true
allow_trusted = true
require_realization = true

# Brave's own official resources for its adblock-rust engine. These join the uBO snapshot in
# the same verified catalog; grade/permission/dependency/realization gates are unchanged.
[resources.brave]
repo = "https://github.com/brave/adblock-resources"
commit = "b84ad0fd6663a88c1402bc06a4abd5ab8be8fb3c"
snapshot_path = "config/resources/brave-official.json"
snapshot_sha256 = "31d6bdd604b45e155d1093064a082b8f93ca63650be4bbb3e338a7a60d485053"

[cosmetic]
allow_native_css = true
light_procedural_allowlist = ["has-text", "matches-attr"]
allow_regex_procedural_args = false
allow_chained_procedural = false
allow_action_operators = false
allow_vetted_scriptlets = true
allow_css_injection = false
allow_js_injection = false

[rewrite]
enabled = [
    "network_canonicalization",
    "type_union",
    "domain_union",
    "exception_type_union",
    "exception_domain_union",
    "to_domain_union",
    "cosmetic_host_union",
    "mask_subsumption",
    "domain_subsumption",
    "hostname_subsumption",
    "pattern_subsumption",
]
ubo_host_semantics = false
regex_fusion = false

# AdGuard's `extension/ublock` optimized lists are rolling upstream files. Each `sha256` pin makes
# the build reproducible and turns upstream changes into an explicit review step.

