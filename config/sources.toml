[engine]
profile = "desktop"
adblock_version = "=0.13.6"
permissions = 0

[output]
path = "dist/RustShield.txt"
emit_order = "compiler-friendly-v1"
inline_audit_comments = false
title = "RustShield"
# Omitted: emitted as the UTC build time in RFC 2822 form.
expires = "2 days"
description = "Rust-verified rules list for Brave Browser."

[verify]
required = true
corpus = ["generated", "fixtures"]
max_mismatches = 0
max_cases = 5000
max_cosmetic_hosts = 256
bench_iterations = 3

[directives]
enabled = true
env = ["chromium", "ext_ublock"]
include_root = "config/includes"

[golden_rule]
require_fast_native = true
require_official_resources = true
require_engine_trust = true
rewrite_or_exclude = true
retain_eligible_non_fusable = true
zero_violations = true

[resources.ubo]
repo = "https://github.com/gorhill/uBlock"
commit = "3cca944b4a4c5f3473d6cb7153e6fb99b5f7d1db"
scriptlets_path = "src/js/resources/scriptlets.js"
snapshot_path = "config/resources/ubo-official.json"
snapshot_sha256 = "ddc13cecf2441456e0c707a484fb7e76a4d82d1ad13b09e8075ee1ab2e4cd038"
trust_bit = 0b00000001
allow_standard = true
allow_trusted = true
require_realization = true

[cosmetic]
allow_native_css = true
light_procedural_allowlist = ["has-text", "matches-attr"]
allow_regex_procedural_args = false
allow_chained_procedural = false
allow_action_operators = false
allow_vetted_scriptlets = true
allow_css_injection = false
allow_js_injection = false

[rewrite]
enabled = [
    "type_union",
    "domain_union",
    "to_domain_union",
    "cosmetic_host_union",
    "mask_subsumption",
    "domain_subsumption",
    "hostname_subsumption",
]
ubo_host_semantics = false
regex_fusion = false

# AdGuard's `extension/ublock` optimized lists are rolling upstream files. Each `sha256` pin makes
# the build reproducible and turns upstream changes into an explicit review step.

